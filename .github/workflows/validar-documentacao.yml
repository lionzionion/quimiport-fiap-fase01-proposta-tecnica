name: Validar documentação Fase 01
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integridade-documental:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar estrutura e links locais
        run: python scripts/validar_entrega.py
