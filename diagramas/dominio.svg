<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="790" viewBox="0 0 1360 790"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8daec7" stroke-width="1.5"/></marker></defs><rect width="1360" height="790" rx="24" fill="#091321"/><text x="35" y="45" fill="#f5f7fb" font-family="Arial,sans-serif" font-weight="700" font-size="27">Diagrama de domínio • agregados e entidades</text><text x="35" y="70" fill="#91adc7" font-family="Arial,sans-serif" font-size="15">QuimiPort • Modelagem conceitual para a Fase 01 da FIAP</text><g><rect x="42" y="157" width="305" height="145" rx="18" fill="#162741" stroke="#18b6a5" stroke-opacity=".75" stroke-width="2"/><rect x="42" y="157" width="7" height="145" rx="4" fill="#18b6a5"/><text x="62" y="191" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">ProdutoQuimico</text><text x="62" y="219" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ id, código, nome</text><text x="62" y="240" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ classe de risco, ativo</text></g><g><rect x="470" y="145" width="390" height="206" rx="18" fill="#162741" stroke="#27ccf5" stroke-opacity=".75" stroke-width="2"/><rect x="470" y="145" width="7" height="206" rx="4" fill="#27ccf5"/><text x="490" y="179" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">CargaQuimica • raiz</text><text x="490" y="207" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ código, produtoId, quantidade</text><text x="490" y="228" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ responsável, status, versão</text><text x="490" y="249" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ liberar(), bloquear()</text><text x="490" y="270" fill="#b5c9df" font-family="Arial,sans-serif" font-size="15">+ historico de transições</text></g><g><rect x="965" y="105" width="350" height="11